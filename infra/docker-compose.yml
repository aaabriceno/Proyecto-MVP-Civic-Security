services:
  db:
    image: postgis/postgis:17-3.5
    container_name: civic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civic_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - civic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civic_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  civic_pgdata:
      